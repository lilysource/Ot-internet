name: iOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_ipa:
        description: "Build and export a signed IPA (requires Apple signing secrets)"
        required: true
        default: false
        type: boolean

jobs:
  simulator:
    name: Build simulator
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select available Xcode
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          fi
          xcodebuild -version
      - name: Show project targets
        run: xcodebuild -list -project OtInternet.xcodeproj
      - name: Build simulator
        run: |
          xcodebuild build \
            -project OtInternet.xcodeproj \
            -scheme OtInternet \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/OtInternet-build.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OtInternet-build-diagnostics
          path: |
            ${{ runner.temp }}/OtInternet-build.xcresult
            ${{ runner.temp }}/DerivedData/Logs

  signed-ipa:
    name: Archive and export signed IPA
    if: github.event_name == 'workflow_dispatch' && inputs.build_ipa == true
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check signing configuration
        id: signing
        env:
          CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$CERTIFICATE" ] && [ -n "$PROFILE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured; skipping signed IPA steps."
          fi
      - name: Install signing certificate and profile
        if: steps.signing.outputs.available == 'true'
        env:
          CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/signing.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          echo -n "$CERTIFICATE" | base64 --decode > "$CERT_PATH"
          echo -n "$PROFILE" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Archive
        if: steps.signing.outputs.available == 'true'
        run: |
          xcodebuild archive \
            -project OtInternet.xcodeproj \
            -scheme OtInternet \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/OtInternet.xcarchive" \
            -configuration Release \
            -allowProvisioningUpdates
      - name: Export IPA
        if: steps.signing.outputs.available == 'true'
        run: xcodebuild -exportArchive -archivePath $RUNNER_TEMP/OtInternet.xcarchive -exportPath $RUNNER_TEMP/export -exportOptionsPlist ExportOptions.plist
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available == 'true'
        with:
          name: OtInternet-ipa
          path: ${{ runner.temp }}/export/*.ipa
