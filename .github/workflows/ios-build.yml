name: Ot Internet iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCHEME: OtInternet
  PROJECT: OtInternet.xcodeproj
  CONFIGURATION: Release
  DERIVED_DATA: build
  ARCHIVE_PATH: build/OtInternet.xcarchive
  IPA_PATH: build/ipa

jobs:
  build:
    name: Build Ot Internet
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select available Xcode
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Show Xcode project
        run: xcodebuild -list -project "$PROJECT"

      - name: Archive unsigned device build
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create unsigned IPA for eSign
        run: |
          mkdir -p "$IPA_PATH/Payload"
          APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find .app inside archive."
            exit 1
          fi
          cp -R "$APP_PATH" "$IPA_PATH/Payload/"
          cd "$IPA_PATH"
          zip -qry "../OtInternet-unsigned.ipa" Payload

      - name: Validate IPA structure
        run: |
          unzip -l build/OtInternet-unsigned.ipa
          unzip -q build/OtInternet-unsigned.ipa -d "$RUNNER_TEMP/ipa-check"
          APP_PATH="$RUNNER_TEMP/ipa-check/Payload/OtInternet.app"
          test -d "$APP_PATH" || { echo "ERROR: IPA has no Payload/OtInternet.app"; exit 1; }
          test -f "$APP_PATH/OtInternet" || { echo "ERROR: App executable is missing"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print:CFBundleExecutable' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print:CFBundleIdentifier' "$APP_PATH/Info.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OtInternet-iOS-IPA
          path: build/OtInternet-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload Xcode archive
        uses: actions/upload-artifact@v4
        with:
          name: OtInternet-XCArchive
          path: build/OtInternet.xcarchive
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OtInternet-Build-Logs
          path: build/
          if-no-files-found: ignore
          retention-days: 7
