name: iOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  simulator:
    name: Build and test simulator
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project OtInternet.xcodeproj -scheme OtInternet
      - name: Build and test
        run: xcodebuild test -project OtInternet.xcodeproj -scheme OtInternet -destination 'platform=iOS Simulator,name=iPhone 15' CODE_SIGNING_ALLOWED=NO

  signed-ipa:
    name: Archive and export signed IPA
    if: github.event_name == 'push'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check signing configuration
        env:
          CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$CERTIFICATE" || { echo "Signing secrets are not configured; skipping signed IPA job."; exit 78; }
          test -n "$PROFILE" || { echo "Signing secrets are incomplete."; exit 1; }
      - name: Install signing certificate and profile
        env:
          CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/signing.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          echo -n "$CERTIFICATE" | base64 --decode > "$CERT_PATH"
          echo -n "$PROFILE" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Archive
        run: xcodebuild archive -project OtInternet.xcodeproj -scheme OtInternet -archivePath $RUNNER_TEMP/OtInternet.xcarchive -configuration Release -allowProvisioningUpdates
      - name: Export IPA
        run: xcodebuild -exportArchive -archivePath $RUNNER_TEMP/OtInternet.xcarchive -exportPath $RUNNER_TEMP/export -exportOptionsPlist ExportOptions.plist
      - uses: actions/upload-artifact@v4
        with:
          name: OtInternet-ipa
          path: ${{ runner.temp }}/export/*.ipa
