name: iOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_ipa:
        description: "Build a private signed IPA for device testing"
        required: true
        default: false
        type: boolean
      build_unsigned_ipa:
        description: "Build an unsigned IPA to import into eSign"
        required: true
        default: true
        type: boolean

jobs:
  simulator:
    name: Build simulator
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select available Xcode
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          fi
          xcodebuild -version
      - name: Show project targets
        run: xcodebuild -list -project OtInternet.xcodeproj
      - name: Find available iPhone simulator
        run: |
          xcrun simctl list devices available
          SIMULATOR_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')
          if [ -n "$SIMULATOR_ID" ]; then
            echo "SIMULATOR_DESTINATION=platform=iOS Simulator,id=$SIMULATOR_ID" >> "$GITHUB_ENV"
          else
            echo "SIMULATOR_DESTINATION=generic/platform=iOS Simulator" >> "$GITHUB_ENV"
            echo "No installed iPhone device found; using generic simulator destination."
          fi
      - name: Build simulator
        run: |
          xcodebuild build \
            -project OtInternet.xcodeproj \
            -scheme OtInternet \
            -sdk iphonesimulator \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/OtInternet-build.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OtInternet-build-diagnostics
          path: |
            ${{ runner.temp }}/OtInternet-build.xcresult
            ${{ runner.temp }}/DerivedData/Logs

  signed-ipa:
    name: Build private device IPA
    if: github.event_name == 'workflow_dispatch' && inputs.build_ipa == true
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check signing configuration
        env:
          CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$CERTIFICATE" || { echo "Missing BUILD_CERTIFICATE_BASE64"; exit 1; }
          test -n "$PROFILE" || { echo "Missing PROVISIONING_PROFILE_BASE64"; exit 1; }
      - name: Install signing certificate and profile
        env:
          CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/signing.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          echo -n "$CERTIFICATE" | base64 --decode > "$CERT_PATH"
          echo -n "$PROFILE" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" -o "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print:UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print:Name' "$RUNNER_TEMP/profile.plist")
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_IDENTIFIER: ${{ secrets.BUNDLE_IDENTIFIER }}
        run: |
          xcodebuild archive \
            -project OtInternet.xcodeproj \
            -scheme OtInternet \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/OtInternet.xcarchive" \
            -configuration Release \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development"
      - name: Export IPA
        env:
          BUNDLE_IDENTIFIER: ${{ secrets.BUNDLE_IDENTIFIER }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>development</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          <key>provisioningProfiles</key><dict>
          <key>$BUNDLE_IDENTIFIER</key><string>$PROFILE_NAME</string>
          </dict></dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OtInternet.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: OtInternet-ipa
          path: ${{ runner.temp }}/export/*.ipa

  unsigned-ipa:
    name: Build unsigned IPA for eSign
    if: github.event_name == 'workflow_dispatch' && inputs.build_unsigned_ipa == true
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select available Xcode
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          fi
          xcodebuild -version
      - name: Archive without Apple signing
        run: |
          xcodebuild archive \
            -project OtInternet.xcodeproj \
            -scheme OtInternet \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/OtInternet-unsigned.xcarchive" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package IPA for eSign
        run: |
          mkdir -p "$RUNNER_TEMP/unsigned-ipa/Payload"
          cp -R "$RUNNER_TEMP/OtInternet-unsigned.xcarchive/Products/Applications/OtInternet.app" "$RUNNER_TEMP/unsigned-ipa/Payload/"
          cd "$RUNNER_TEMP/unsigned-ipa"
          zip -qry "$RUNNER_TEMP/OtInternet-eSign.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OtInternet-eSign-unsigned-ipa
          path: ${{ runner.temp }}/OtInternet-eSign.ipa
